# Bandroom own coach runner — log rotation template.
# Install to /etc/logrotate.d/bandroom-coach-runner.
# JSON lines are written by cron/systemd to this file; rotate daily and keep 14.
/var/log/bandroom/coach-runner.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}